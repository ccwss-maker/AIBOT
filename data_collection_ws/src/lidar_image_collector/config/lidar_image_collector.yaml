# ==============================================================================
# Lidar Image Collector Configuration
# 雷达图像采集配置文件
# ==============================================================================

# ==============================================================================
# 坐标系配置
# ==============================================================================
robot_base_frame: local_map          # 机器人坐标系，默认: base_link

# ==============================================================================
# 传感器配置 (支持LaserScan和PointCloud2类型)
# ==============================================================================
observation_sources: vanjee_front_sensor vanjee_back_sensor laser_scan_sensor

# 前置雷达传感器
vanjee_front_sensor:
  topic: /front_filtered_points
  sensor_frame: vanjee_lidar_front

# 后置雷达传感器
vanjee_back_sensor:
  topic: /back_filtered_points
  sensor_frame: vanjee_lidar_back

# 激光雷达传感器
laser_scan_sensor:
  topic: /local_map_laserscan
  sensor_frame: local_map

# ==============================================================================
# 地图配置
# ==============================================================================
map_width: 8.0                       # 地图宽度 (米)，默认: 10.0
map_height: 8.0                      # 地图高度 (米)，默认: 5.0
resolution: 0.01                     # 分辨率 (米/像素)，默认: 0.01

# ==============================================================================
# 图像配置
# ==============================================================================
image_rows: 960                      # 图像高度 (像素)
image_cols: 960                      # 图像宽度 (像素)
point_intensity: 255                 # 点云在图像中的强度值 (0-255)

# ==============================================================================
# 点云过滤范围
# ==============================================================================
min_x: -5.0                          # X轴最小值 (米)
max_x: 5.0                           # X轴最大值 (米)
min_y: -5.0                          # Y轴最小值 (米)
max_y: 5.0                           # Y轴最大值 (米)
min_z: -1.0                          # Z轴最小值 (米)
max_z: 2.0                           # Z轴最大值 (米)

# ==============================================================================
# 图像处理
# ==============================================================================
apply_blur: false                    # 是否应用高斯模糊
blur_kernel_size: 3                  # 模糊核大小 (必须为奇数)

# ==============================================================================
# 发布话题配置
# ==============================================================================
image_topic: /lidar_image            # 输出图像话题
merged_cloud_topic: /merged_cloud    # 合并后的点云话题
publish_merged_cloud: false           # 是否发布合并后的点云
