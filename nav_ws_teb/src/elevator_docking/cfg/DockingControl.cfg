#!/usr/bin/env python
# -*- coding: utf-8 -*-

PACKAGE = "elevator_docking"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ==============================================================================
# 对接控制参数
# ==============================================================================
control_group = gen.add_group("ControlParameters", type="tab")
control_group.add("control_rate", double_t, 0,
                  "控制频率 (Hz)", 20.0, 5.0, 50.0)
control_group.add("detection_duration", double_t, 0,
                  "每次检测持续时间 (秒)", 0.5, 0.1, 5.0)

# ==============================================================================
# 速度参数
# ==============================================================================
velocity_group = gen.add_group("VelocityParameters", type="tab")
velocity_group.add("yaw_angular_vel", double_t, 0,
                   "偏航角速度 (rad/s)", 0.8, 0.05, 2.0)
velocity_group.add("y_linear_vel", double_t, 0,
                   "Y方向线速度 (m/s)", 0.2, 0.05, 2.0)
velocity_group.add("x_linear_vel", double_t, 0,
                   "X方向前进速度 (m/s)", 0.4, 0.05, 2.0)
velocity_group.add("x_backward_vel", double_t, 0,
                   "X方向后退速度 (m/s)", 0.4, 0.05, 2.0)

# ==============================================================================
# 容差参数
# ==============================================================================
tolerance_group = gen.add_group("ToleranceParameters", type="tab")
tolerance_group.add("yaw_tolerance", double_t, 0,
                    "偏航角容差 (rad)", 0.01, 0.001, 0.2)
tolerance_group.add("y_tolerance", double_t, 0,
                    "Y方向位置容差 (m)", 0.01, 0.005, 0.2)
tolerance_group.add("x_tolerance", double_t, 0,
                    "X方向位置容差 (m)", 0.01, 0.005, 0.2)

exit(gen.generate(PACKAGE, "elevator_docking_server", "DockingControl"))
