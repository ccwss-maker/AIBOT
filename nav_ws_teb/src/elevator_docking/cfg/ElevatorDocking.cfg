#!/usr/bin/env python
# -*- coding: utf-8 -*-

PACKAGE = "elevator_docking"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ==============================================================================
# 地图和坐标系配置
# ==============================================================================
gen.add("map_width", double_t, 0,
        "地图宽度 (米)", 5.0, 1.0, 20.0)
gen.add("map_height", double_t, 0,
        "地图高度 (米)", 5.0, 1.0, 20.0)

# ==============================================================================
# 发布开关配置
# ==============================================================================
gen.add("publish_filtered_points", bool_t, 0,
        "是否发布过滤后的点云", True)
gen.add("publish_line_markers", bool_t, 0,
        "是否发布检测到的直线段标记", True)
gen.add("publish_merged_line_markers", bool_t, 0,
        "是否发布合并后的线段标记", True)
gen.add("publish_connected_line_markers", bool_t, 0,
        "是否发布连接后的线段标记", True)
gen.add("publish_elevator_marker", bool_t, 0,
        "是否发布电梯矩形标记", False)

# ==============================================================================
# 电梯检测参数
# ==============================================================================
# 电梯门尺寸约束
gen.add("min_door_width", double_t, 0,
        "电梯门最小宽度 (米)", 0.8, 0.5, 2.0)
gen.add("max_door_width", double_t, 0,
        "电梯门最大宽度 (米)", 1.5, 1.0, 3.0)
gen.add("min_door_depth", double_t, 0,
        "电梯门最小深度 (米)", 1.0, 0.5, 3.0)
gen.add("max_door_depth", double_t, 0,
        "电梯门最大深度 (米)", 2.5, 1.5, 5.0)

# ==============================================================================
# 点云聚类参数（阶段1: 预过滤）
# ==============================================================================
gen.add("cluster_tolerance", double_t, 0,
        "欧氏聚类距离阈值 (米)", 0.1, 0.01, 0.5)
gen.add("min_cluster_size", int_t, 0,
        "最小簇点数", 5, 3, 50)
gen.add("max_cluster_size", int_t, 0,
        "最大簇点数", 10000, 100, 50000)

# ==============================================================================
# 直线检测参数（阶段2: RANSAC检测）
# ==============================================================================
gen.add("ransac_distance_threshold", double_t, 0,
        "RANSAC距离阈值 (米)", 0.05, 0.01, 0.2)
gen.add("min_line_points", int_t, 0,
        "直线最少点数", 10, 5, 50)
gen.add("line_gap_threshold", double_t, 0,
        "线段间隙阈值-用于拆分 (米)", 0.2, 0.05, 1.0)

# ==============================================================================
# 线段过滤参数（阶段3: 长度过滤）
# ==============================================================================
gen.add("min_line_length", double_t, 0,
        "最短直线长度 (米)", 0.1, 0.05, 2.0)
gen.add("max_line_length", double_t, 0,
        "最长直线长度 (米)", 2.0, 1.0, 20.0)

# ==============================================================================
# 平行线合并参数（阶段4: 平行线分组与合并）
# ==============================================================================
gen.add("merge_angle_threshold", double_t, 0,
        "平行线合并角度阈值 (度)", 5.0, 0.5, 15.0)
gen.add("merge_distance_threshold", double_t, 0,
        "平行线合并法向距离阈值 (米)", 0.05, 0.01, 0.5)

# ==============================================================================
# 电梯识别参数
# ==============================================================================
gen.add("parallel_angle_threshold", double_t, 0,
        "平行判断角度阈值 (度)", 10.0, 1.0, 30.0)
gen.add("perpendicular_angle_threshold", double_t, 0,
        "垂直判断角度阈值 (度)", 10.0, 1.0, 30.0)

# ==============================================================================
# 可视化配置
# ==============================================================================
gen.add("marker_lifetime", double_t, 0,
        "标记生存时间 (秒)", 0.5, 0.1, 5.0)
gen.add("marker_scale", double_t, 0,
        "标记线条粗细 (米)", 0.05, 0.01, 0.2)

exit(gen.generate(PACKAGE, "elevator_docking", "ElevatorDocking"))
