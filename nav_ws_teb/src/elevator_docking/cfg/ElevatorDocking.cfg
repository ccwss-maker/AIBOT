# ==============================================================================
# 地图和可视化配置
# ==============================================================================
visualization_group = gen.add_group("MapAndVisualization", type="tab")

# 地图配置
visualization_group.add("map_width", double_t, 0,
                        "地图宽度 (米)", 7.0, 1.0, 20.0)
visualization_group.add("map_height", double_t, 0,
                        "地图高度 (米)", 5.0, 1.0, 20.0)

# 可视化开关
visualization_group.add("publish_filtered_points", bool_t, 0,
                        "发布过滤后的点云", True)
visualization_group.add("publish_line_markers", bool_t, 0,
                        "发布检测到的直线段标记", True)
visualization_group.add("publish_merged_line_markers", bool_t, 0,
                        "发布合并后的线段标记", True)
visualization_group.add("publish_connected_line_markers", bool_t, 0,
                        "发布连接后的线段标记", True)
visualization_group.add("publish_elevator_marker", bool_t, 0,
                        "发布电梯矩形标记", True)
visualization_group.add("marker_lifetime", double_t, 0,
                        "标记生存时间 (秒)", 0.5, 0.1, 5.0)
visualization_group.add("marker_scale", double_t, 0,
                        "标记线条粗细 (米)", 0.05, 0.01, 0.2)

exit(gen.generate(PACKAGE, "elevator_docking", "ElevatorDocking"))
