#!/usr/bin/env python
# -*- coding: utf-8 -*-

PACKAGE = "elevator_docking"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ==============================================================================
# 阶段1: 点云聚类参数（预过滤）
# ==============================================================================
clustering_group = gen.add_group("Stage1_Clustering", type="tab")
clustering_group.add("cluster_tolerance", double_t, 0,
                     "欧氏聚类距离阈值 (米)", 0.1, 0.01, 0.5)
clustering_group.add("min_cluster_size", int_t, 0,
                     "最小簇点数", 5, 3, 50)
clustering_group.add("max_cluster_size", int_t, 0,
                     "最大簇点数", 10000, 100, 50000)

# ==============================================================================
# 阶段2: 直线检测参数（RANSAC检测）
# ==============================================================================
ransac_group = gen.add_group("Stage2_LineDetection", type="tab")
ransac_group.add("ransac_distance_threshold", double_t, 0,
                 "RANSAC距离阈值 (米)", 0.05, 0.01, 0.2)
ransac_group.add("min_line_points", int_t, 0,
                 "直线最少点数", 10, 5, 50)
ransac_group.add("line_gap_threshold", double_t, 0,
                 "线段间隙阈值-用于拆分 (米)", 0.2, 0.05, 1.0)

# ==============================================================================
# 阶段3: 线段过滤参数（长度过滤）
# ==============================================================================
filter_group = gen.add_group("Stage3_LineFiltering", type="tab")
filter_group.add("min_line_length", double_t, 0,
                 "最短直线长度 (米)", 0.3, 0.05, 2.0)
filter_group.add("max_line_length", double_t, 0,
                 "最长直线长度 (米)", 3.0, 1.0, 20.0)

# ==============================================================================
# 阶段4: 平行线合并参数
# ==============================================================================
merge_group = gen.add_group("Stage4_ParallelMerging", type="tab")
merge_group.add("merge_angle_threshold", double_t, 0,
                "平行线合并角度阈值 (度)", 10.0, 0.5, 15.0)
merge_group.add("merge_distance_threshold", double_t, 0,
                "平行线合并法向距离阈值 (米)", 0.2, 0.01, 0.5)

# ==============================================================================
# 阶段5: 电梯识别参数（矩形拟合）
# ==============================================================================
recognition_group = gen.add_group("Stage5_ElevatorRecognition", type="tab")
recognition_group.add("min_door_width", double_t, 0,
                      "电梯门最小宽度 (米)", 0.8, 0.5, 2.0)
recognition_group.add("max_door_width", double_t, 0,
                      "电梯门最大宽度 (米)", 1.5, 1.0, 3.0)
recognition_group.add("min_door_depth", double_t, 0,
                      "电梯门最小深度 (米)", 1.1, 0.5, 3.0)
recognition_group.add("max_door_depth", double_t, 0,
                      "电梯门最大深度 (米)", 2.5, 1.5, 5.0)
recognition_group.add("parallel_angle_threshold", double_t, 0,
                      "平行判断角度阈值 (度)", 10.0, 1.0, 30.0)
recognition_group.add("perpendicular_angle_threshold", double_t, 0,
                      "垂直判断角度阈值 (度)", 10.0, 1.0, 30.0)

