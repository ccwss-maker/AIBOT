TebLocalPlannerROS:
  
  # ==================== 轨迹配置 ====================
  teb_autosize: True  # 自动调整轨迹时间分辨率（根据速度自动调整点数）
  dt_ref: 0.2  # 轨迹时间分辨率（秒），稍微放大一点，过小反而不稳定
  dt_hysteresis: 0.1  # 时间分辨率的滞后，防止频繁调整
  max_samples: 500  # 最大轨迹采样点数
  global_plan_overwrite_orientation: False  # ★改为False！让小车自己决定朝向
  allow_init_with_backwards_motion: True  # 允许向后运动初始化
  max_global_plan_lookahead_dist: 1.0  # 全局路径前瞻距离（米）
  global_plan_viapoint_sep: 0.5  # 全局路径中间点分离距离
  global_plan_prune_distance: 1.0  # 裁剪全局路径中已通过的点的距离
  exact_arc_length: False  # 是否精确计算弧长（False性能更好）
  feasibility_check_no_poses: 5  # 可行性检查的位姿数量
  publish_feedback: False  # 是否发布规划反馈信息
  
  # ==================== 机器人配置（全向轮） ====================
  max_vel_x: 1.0  # X方向最大线速度（m/s，前后方向）
  max_vel_x_backwards: 1.0  # 后退最大速度（与前进一样）
  max_vel_y: 0.5  # ★Y方向最大线速度（提高到1.0，与X一致）
  max_vel_theta: 0.5  # ★最大角速度（rad/s），降低以减少旋转抖动
  acc_lim_x: 0.5  # X方向最大加速度
  acc_lim_y: 0.25  # Y方向最大加速度
  acc_lim_theta: 0.5  # ★角加速度限制，降低让转动更平滑
  min_turning_radius: 0.0  # 最小转弯半径（全向轮设为0）
  wheelbase: 0.0  # 车轴距离（仅阿克曼模型需要）
  cmd_angle_instead_rotvel: False  # 是否发送转角而非角速度
  
  # 机器人外形（矩形：长0.9m x 宽0.6m）
  footprint_model:
    type: "polygon"  # 多边形模型
    vertices: [[0.45, 0.30], [0.45, -0.30], [-0.45, -0.30], [-0.45, 0.30]]  # 你的footprint坐标
  
  # ==================== 目标点容差 ====================
  xy_goal_tolerance: 0.15  # 到达目标的位置容差（米）
  yaw_goal_tolerance: 0.3  # ★放宽角度容差（因为不在乎朝向）
  free_goal_vel: False  # 到达目标时是否允许有速度
  complete_global_plan: True  # 是否完整跟随全局路径
  
  # ==================== 障碍物配置 ====================
  # min_obstacle_dist: 0.1  # ★增加安全距离，减少频繁避障调整
  # inflation_dist: 0.6  # 障碍物膨胀距离
  # include_costmap_obstacles: True  # 是否考虑代价地图中的障碍物
  # costmap_obstacles_behind_robot_dist: 1.5  # 考虑机器人后方障碍物的距离
  # obstacle_poses_affected: 10  # ★减少受障碍物影响的轨迹点数
  
  # dynamic_obstacle_inflation_dist: 0.3  # 动态障碍物膨胀距离
  # include_dynamic_obstacles: True  # 是否考虑动态障碍物
  
  costmap_converter_plugin: ""  # 代价地图转换插件（空表示不用）
  costmap_converter_spin_thread: True  # 是否在单独线程中运行转换器
  costmap_converter_rate: 5  # 转换器运行频率（Hz）
  
  # ==================== 优化配置（关键！影响平滑度） ====================
  no_inner_iterations: 5  # 内循环优化迭代次数
  no_outer_iterations: 4  # 外循环优化迭代次数
  optimization_activate: True  # 是否激活优化
  optimization_verbose: False  # 是否输出详细优化信息
  penalty_epsilon: 0.05  # 惩罚函数的安全边界
  obstacle_cost_exponent: 2  # 障碍物代价指数（越大越远离障碍物）
  
  # ==================== 权重参数（关键！） ====================
  weight_max_vel_x: 2  # X方向速度权重
  weight_max_vel_y: 2  # Y方向速度权重（与X相同）
  weight_max_vel_theta: 0.5  # ★降低角速度权重，减少旋转倾向
  weight_acc_lim_x: 1  # X加速度权重
  weight_acc_lim_y: 1  # Y加速度权重
  weight_acc_lim_theta: 1  # 角加速度权重
  weight_kinematics_nh: 1  # ★★非完整性约束权重（降低到1！全向轮不需要）
  weight_kinematics_forward_drive: 0  # ★★前进驱动权重设为0！不强制前进
  weight_kinematics_turning_radius: 0  # ★转弯半径权重设为0
  weight_optimaltime: 1.0  # ★降低时间最优权重，更注重平滑
  weight_shortest_path: 1  # ★增加最短路径权重，让路径更直
  weight_obstacle: 30  # 障碍物权重
  weight_inflation: 0.1  # 膨胀层权重
  weight_dynamic_obstacle: 10  # 动态障碍物权重
  weight_dynamic_obstacle_inflation: 0.2  # 动态障碍物膨胀权重
  weight_viapoint: 10  # 中间点权重
  weight_adapt_factor: 2  # 自适应权重因子
  
  # ==================== 并行规划（多路径） ====================
  enable_homotopy_class_planning: False  # 关闭并行规划，减少路径切换引起的扭动
  enable_multithreading: True  # 是否启用多线程
  max_number_classes: 4  # 最大同伦类数量
  selection_cost_hysteresis: 1.0  # 路径选择代价滞后
  selection_prefer_initial_plan: 0.95  # 偏好初始路径的程度（增加稳定性）
  selection_obst_cost_scale: 100.0  # 障碍物代价缩放
  selection_alternative_time_cost: False  # 是否考虑备选路径时间代价
  
  roadmap_graph_no_samples: 15  # 路线图采样点数
  roadmap_graph_area_width: 5  # 路线图区域宽度
  roadmap_graph_area_length_scale: 1.0  # 路线图区域长度缩放
  h_signature_prescaler: 0.5  # H签名预缩放因子
  h_signature_threshold: 0.1  # H签名阈值
  obstacle_heading_threshold: 0.45  # 障碍物朝向阈值（rad）
  switching_blocking_period: 0.0  # 切换阻塞周期（秒）
  viapoints_all_candidates: True  # 是否所有候选路径都考虑中间点
  delete_detours_backwards: True  # 是否删除后退绕路
  max_ratio_detours_duration_best_duration: 3.0  # 绕路时间与最佳时间的最大比值
  visualize_hc_graph: False  # 是否可视化同伦类图
  visualize_with_time_as_z_axis_scale: False  # 可视化时是否用时间作为Z轴