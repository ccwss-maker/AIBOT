# NTU Controller 参数配置
NTUController:
  # 速度限制
  max_vel_x: 0.5              # 最大线速度 (m/s)
  max_vel_theta: 0.3          # 最大角速度 (rad/s)

  # 目标容差
  xy_goal_tolerance: 0.2      # XY 位置容差 (m)
  yaw_goal_tolerance: 0.2     # 航向角容差 (rad)

  # Pure Pursuit 参数
  lookahead_distance: 0.5     # 前瞻距离 (m)，越大轨迹越平滑但反应越慢

  # ========== 轨迹优化器参数（始终启用）==========
  trajectory_optimizer:
    # 权重参数
    weight_time: 0.1          # 时间代价权重（越小越希望时间短）
    weight_energy_x: 1.0      # X 方向平滑度权重
    weight_energy_y: 1.0      # Y 方向平滑度权重
    weight_energy_w: 0.1      # 航向角平滑度权重
    weight_position_x: 1.0  # X 方向位置误差权重（越大越贴近路径）
    weight_position_y: 1.0  # Y 方向位置误差权重
    weight_position_w: 1.0    # 航向角位置误差权重

    # 采样和时间参数
    init_time: 0.5            # 初始每段时间间隔 (秒)
    astar_point_interval: 2   # 路径点采样间隔（每隔几个点取一个）

    # 优化算法参数
    max_iterations: 1000      # LBFGS 最大迭代次数
    min_step: 1.0e-5          # 最小步长
    epsilon: 1.0e-5           # 收敛阈值

    # 可视化参数
    viz_only_control_points: true  # true: 仅显示控制点, false: 显示采样轨迹
    viz_time_step: 0.2       # 轨迹采样时间步长（秒），仅在 viz_only_control_points=false 时生效
