DWAPlannerROS:

  # 速度参数（全向轮）
  max_vel_x: 0.8         # 最大x方向速度
  min_vel_x: -0.8        # 最小x方向速度 (允许倒车)
  max_vel_y: 0.4         # ★全向轮的最大y方向速度（不再是0！）
  min_vel_y: -0.4        # ★全向轮的最小y方向速度
  max_vel_trans: 0.8     # 最大平移速度
  min_vel_trans: 0.1     # 最小平移速度
  trans_stopped_vel: 0.05 # 当平移速度小于这个值，就让机器人停止
  acc_lim_trans: 8.0    # 最大平移加速度
  acc_lim_x: 8.0        # x方向的最大加速度上限
  acc_lim_y: 8.0        # ★y方向的加速度上限（全向轮要设置）
  max_vel_theta: 0.8     # ★降低最大旋转速度，减少扭动
  min_vel_theta: 0.05    # ★降低最小角速度，允许微调
  theta_stopped_vel: 0.05 # 当旋转速度小于这个值，就让机器人停止
  acc_lim_theta: 4.0     # ★降低旋转的加速度上限

  # 目标容差参数
  yaw_goal_tolerance: 0.5          # ★放宽目标航向容差（约28.6度）
  xy_goal_tolerance: 0.20          # ★缩小目标xy容差，更精准停止
  latch_xy_goal_tolerance: false   # ★★改为false！不要到位后只旋转
  
  # 向前模拟参数
  # sim_time: 5.0       # 模拟时间
  # vx_samples: 30      # x方向速度采样数
  # vy_samples: 20      # ★全向轮y方向速度采样数（不再是0）
  # vtheta_samples: 20  # 旋转速度采样数
  sim_time: 2.0        # ★从5.0降到2.0！模拟时间
  vx_samples: 10       # ★从30降到10！x方向速度采样
  vy_samples: 10       # ★从20降到10！y方向速度采样
  vtheta_samples: 15   # ★从20降到15！旋转速度采样

  # 轨迹评分参数
  path_distance_bias: 48.0       # 靠近全局路径的权重
  goal_distance_bias: 32.0       # 接近导航目标点的权重
  occdist_scale: 0.1             # 控制器避障的权重
  
  # ★★ 朝向控制参数（让车头沿着路径走）
  heading_lookahead: 0.325       # 前瞻距离，用于计算期望朝向
  heading_scoring: true          # 启用朝向评分
  heading_scoring_timestep: 0.5  # 朝向评分的时间步长
  
  # ★★ 朝向权重（越大越倾向于车头对准运动方向）
  twirling_scale: 0.0            # 惩罚原地旋转（设为0允许旋转）

  forward_point_distance: 0.325  # 从机器人到评分点的距离
  stop_time_buffer: 0.2          # 在碰撞前机器人必须停止的时间长度
  scaling_speed: 10.0            # 缩放机器人速度的绝对值
  max_scaling_factor: 0.2        # 机器人足迹在高速时能缩放的最大系数

  # 防振动参数
  oscillation_reset_dist: 0.1 # 重置振动标志前需要行进的距离

  # 辅助调试选项
  publish_traj_pc: true          # 是否在 Rviz 里发布轨迹
  publish_cost_grid_pc: false     # 是否在 Rviz 里发布代价网格
  global_frame_id: map           # 基础坐标系

  # 全向轮机器人配置
  holonomic_robot: true          # ★★改为true！全向移动机器人