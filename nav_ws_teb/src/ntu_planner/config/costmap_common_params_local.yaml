footprint: [[0.45, 0.30], [0.45, -0.30], [-0.45, -0.30], [-0.45, 0.30]]
# footprint: [[0.37,0.27],[0.37,-0.33],[-0.53,-0.33],[-0.53,0.27]]
transform_tolerance: 0.2
map_type: costmap
cost_scaling_factor:  5.0  # exponential rate at which the obstacle cost drops off (default: 10)
inflation_radius:     0.2  # max. distance from an obstacle at which costs are incurred for planning paths.
obstacle_layer:
 enabled: true
 obstacle_range: 10.0
 raytrace_range: 10.0
 inflation_radius: 0.2
 track_unknown_space: false
 combination_method: 1
#  observation_sources: vanjee_front_sensor vanjee_back_sensor
 observation_sources: laser_scan_sensor vanjee_front_sensor vanjee_back_sensor
#  laser_scan_sensor: 
