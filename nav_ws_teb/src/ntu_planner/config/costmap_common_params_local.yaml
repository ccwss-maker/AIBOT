# Local Costmap Configuration
# 基于 costmap_2d 源代码的标准参数

# ============================================================================
# 坐标系配置 (Costmap2DROS 核心参数)
# ============================================================================
global_frame: map                    # 全局坐标系，默认: map
robot_base_frame: local_map          # 机器人坐标系，默认: base_link

# ============================================================================
# 地图模式配置
# ============================================================================
static_map: false                    # 是否使用静态地图，默认: true
rolling_window: true                 # 是否使用滚动窗口（动态地图），默认: false
                                     # Local costmap 通常使用 rolling_window=true

# ============================================================================
# 滚动窗口地图尺寸配置 (rolling_window=true 时有效)
# ============================================================================
width: 5.0                          # 地图宽度 (米)，默认: 10
height: 5.0                         # 地图高度 (米)，默认: 10
resolution: 0.1                      # 地图分辨率 (米/格)，默认: 0.05

# ============================================================================
# 更新频率配置
# ============================================================================
update_frequency: 10.0               # Costmap更新频率 (Hz)，默认: 5.0
publish_frequency: 5.0               # 可视化发布频率 (Hz)，默认: 0.0 (不发布)

# ============================================================================
# TF 变换配置
# ============================================================================
transform_tolerance: 0.5             # TF数据延迟容忍度 (秒)，默认: 0.3

# ============================================================================
# 机器人轮廓配置
# ============================================================================
footprint: [[0.45, 0.30], [0.45, -0.30], [-0.45, -0.30], [-0.45, 0.30]]
# robot_radius: 0.46                 # 圆形机器人半径 (米)，与footprint二选一，默认: 0.46
footprint_padding: 0.01              # 轮廓填充 (米)，默认: 0.01

# ============================================================================
# 插件配置 (必须配置)
# ============================================================================
plugins:
  - {name: obstacle_layer,    type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer,   type: "costmap_2d::InflationLayer"}

# ============================================================================
# Obstacle Layer 配置
# ============================================================================
obstacle_layer:
  enabled: true                      # 是否启用，默认: true
  footprint_clearing_enabled: true   # 是否清除机器人轮廓内的障碍物，默认: true
  max_obstacle_height: 2.0           # 障碍物最大高度 (米)，默认: 2.0
  combination_method: 1              # 层组合方法: 0=覆盖, 1=最大值, 99=不操作，默认: 1
  
  # 障碍物检测范围
  obstacle_range: 10.0               # 障碍物检测最大距离 (米)，默认: 2.5
  raytrace_range: 10.0               # 光线追踪清除距离 (米)，默认: 3.0
  track_unknown_space: false         # 是否跟踪未知空间，默认: 继承自layered_costmap
  
  # 观测数据源配置
  observation_sources: laser_scan_sensor vanjee_front_sensor vanjee_back_sensor
  
  # 激光雷达传感器1
  laser_scan_sensor:
    data_type: LaserScan             # 数据类型: LaserScan, PointCloud, PointCloud2
    topic: /local_map_laserscan      # 话题名称
    sensor_frame: local_map          # 传感器坐标系
    marking: true                    # 是否用于标记障碍物，默认: true
    clearing: true                   # 是否用于清除障碍物，默认: false
    min_obstacle_height: -100.0      # 障碍物最小高度 (米)，默认: 0.0
    max_obstacle_height: 100.0       # 障碍物最大高度 (米)，默认: 2.0
    # observation_persistence: 0.0   # 观测数据保持时间 (秒)，默认: 0.0
    # expected_update_rate: 0.0      # 期望更新频率 (Hz)，默认: 0.0
    # inf_is_valid: false            # 是否将inf值视为有效，默认: false
  
  # 前置雷达传感器
  vanjee_front_sensor:
    data_type: LaserScan
    topic: /front_filtered_points
    sensor_frame: vanjee_lidar_front
    marking: true
    clearing: true
    min_obstacle_height: -100.0
    max_obstacle_height: 100.0
  
  # 后置雷达传感器
  vanjee_back_sensor:
    data_type: LaserScan
    topic: /back_filtered_points
    sensor_frame: vanjee_lidar_back
    marking: true
    clearing: true
    min_obstacle_height: -100.0
    max_obstacle_height: 100.0

# ============================================================================
# Inflation Layer 配置
# ============================================================================
inflation_layer:
  enabled: true                      # 是否启用，默认: true
  inflation_radius: 0.10             # 膨胀半径 (米)，默认: 0.55
  cost_scaling_factor: 1.0           # 代价缩放因子，默认: 10.0
  inflate_unknown: false             # 是否膨胀未知区域，默认: false
