#   min_obstacle_height: -0.5

 laser_scan_sensor: 
  data_type: LaserScan
  topic: /local_map_laserscan
  sensor_frame: local_map
  marking: true
  clearing: true
  max_obstacle_height: 100.0
  min_obstacle_height: -100.0
 vanjee_front_sensor:
  data_type: LaserScan
  topic: /front_filtered_points
  sensor_frame: vanjee_lidar_front
  marking: true
  clearing: true
  max_obstacle_height: 100.0
  min_obstacle_height: -100.0
 vanjee_back_sensor:
  data_type: LaserScan
  topic: /back_filtered_points
  sensor_frame: vanjee_lidar_back
  marking: true
  clearing: true
  max_obstacle_height: 100.0
  min_obstacle_height: -100.0
inflation_layer:
  enabled:              true
static_layer:
  enabled:              true
  map_topic:            "map"
