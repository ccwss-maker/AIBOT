# Global Costmap Configuration
# 基于 costmap_2d 源代码的标准参数

# ============================================================================
# 坐标系配置 (Costmap2DROS 核心参数)
# ============================================================================
global_frame: map                    # 全局坐标系，默认: map
robot_base_frame: local_map          # 机器人坐标系，默认: base_link

# ============================================================================
# 地图模式配置
# ============================================================================
static_map: true                     # 是否使用静态地图，默认: true
rolling_window: false                # 是否使用滚动窗口（动态地图），默认: false
                                     # 注意: static_map=true 时，rolling_window 必须为 false

# ============================================================================
# 更新频率配置
# ============================================================================
update_frequency: 1.0                # Costmap更新频率 (Hz)，默认: 5.0
publish_frequency: 0.5               # 可视化发布频率 (Hz)，默认: 0.0 (不发布)

# ============================================================================
# TF 变换配置
# ============================================================================
transform_tolerance: 0.5             # TF数据延迟容忍度 (秒)，默认: 0.3

# ============================================================================
# 机器人轮廓配置
# ============================================================================
footprint: [[0.45, 0.30], [0.45, -0.30], [-0.45, -0.30], [-0.45, 0.30]]
footprint_padding: 0.01              # 轮廓填充 (米)，默认: 0.01

# ============================================================================
# 插件配置 (必须配置)
# ============================================================================
plugins:
  - {name: static_layer,      type: "costmap_2d::StaticLayer"}
  - {name: inflation_layer,   type: "costmap_2d::InflationLayer"}

# ============================================================================
# Static Layer 配置
# ============================================================================
static_layer:
  enabled: true                      # 是否启用，默认: true
  map_topic: "map"                   # 地图话题名称，默认: "map"

# ============================================================================
# Inflation Layer 配置 (关键：控制路径远离障碍物)
# ============================================================================
inflation_layer:
  enabled: true                      # 是否启用，默认: true
  inflation_radius: 1.2              # 膨胀半径 (米)，默认: 0.55
                                     # 阿克曼车建议: 1.0-1.5米（考虑转弯半径）
                                     # 值越大，代价梯度范围越广
  cost_scaling_factor: 10.0          # 代价缩放因子，默认: 10.0
                                     # 值越小，代价衰减越慢，路径越远离障碍物
                                     # 推荐: 5.0-15.0，阿克曼车用 8.0-12.0

# ============================================================================

global_frame: map
robot_base_frame: local_map
update_frequency: 1.0
publish_frequency: 0.5
static_map: true

plugins:
  - {name: static_layer,            type: "costmap_2d::StaticLayer"}
  - {name: inflation_layer,         type: "costmap_2d::InflationLayer"}