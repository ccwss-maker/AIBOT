# DWA Local Planner Configuration
# 基于 dwa_local_planner 和 base_local_planner 源代码的标准参数

DWAPlannerROS:
  # ============================================================================
  # 机器人速度限制 (Generic Local Planner 参数)
  # ============================================================================
  # X 方向速度
  max_vel_x: 1.5                   # X方向最大速度 (m/s)，默认: 0.55
  min_vel_x: -1.5                  # X方向最小速度 (m/s)，默认: 0.0 (负值允许倒车)
  
  # Y 方向速度 (全向移动机器人)
  max_vel_y: 0.0                  # Y方向最大速度 (m/s)，默认: 0.1
  min_vel_y: 0.0                 # Y方向最小速度 (m/s)，默认: -0.1
  
  # 平移速度
  max_vel_trans: 1.5               # 最大平移速度 (m/s)，默认: 0.55
  min_vel_trans: 0.1               # 最小平移速度 (m/s)，默认: 0.1
  trans_stopped_vel: 0.05          # 认为停止的平移速度阈值 (m/s)，默认: 0.1
  
  # 旋转速度
  max_vel_theta: 1.0               # 最大旋转速度 (rad/s)，默认: 1.0
  min_vel_theta: 0.1               # 最小旋转速度 (rad/s)，默认: 0.4
  theta_stopped_vel: 0.05          # 认为停止的旋转速度阈值 (rad/s)，默认: 0.1

  # ============================================================================
  # 加速度限制 (Generic Local Planner 参数)
  # ============================================================================
  acc_lim_x: 12.0                  # X方向加速度限制 (m/s^2)，默认: 2.5
  acc_lim_y: 0.0                   # Y方向加速度限制 (m/s^2)，默认: 2.5
  acc_lim_theta: 5.0               # 旋转加速度限制 (rad/s^2)，默认: 3.2
  acc_lim_trans: 12.0              # 平移加速度限制 (m/s^2)，默认: 0.1

  # ============================================================================
  # 目标容差 (Generic Local Planner 参数)
  # ============================================================================
  xy_goal_tolerance: 0.25          # XY位置目标容差 (m)，默认: 0.1
  yaw_goal_tolerance: 0.15         # 航向角目标容差 (rad)，默认: 0.1
  latch_xy_goal_tolerance: true   # 到达XY容差后锁定，只旋转到目标角度，默认: false

  # ============================================================================
  # 前瞻模拟参数 (DWA 特有)
  # ============================================================================
  sim_time: 1.7                    # 前向模拟轨迹的时间 (s)，默认: 1.7
  sim_granularity: 0.025           # 轨迹碰撞检测粒度 (m)，默认: 0.025
  angular_sim_granularity: 0.1     # 旋转碰撞检测粒度 (rad)，默认: 0.1
  
  # 速度空间采样
  vx_samples: 10                   # X方向速度采样数，默认: 3
  vy_samples: 0                   # Y方向速度采样数，默认: 10
  vth_samples: 10                  # 旋转速度采样数，默认: 20 (原配置中为vtheta_samples)
  
  use_dwa: true                    # 使用动态窗口法限制采样速度，默认: true

  # ============================================================================
  # 轨迹评分参数 (DWA 特有)
  # ============================================================================
  path_distance_bias: 48.0         # 路径距离权重，默认: 0.6 (32.0)
  goal_distance_bias: 32.0         # 目标距离权重，默认: 0.8 (24.0)
  occdist_scale: 0.08              # 障碍物距离权重，默认: 0.01
  twirling_scale: 1.0              # 惩罚航向变化权重，默认: 0.0
  
  forward_point_distance: 0.325    # 机器人中心到评分点距离 (m)，默认: 0.325
  stop_time_buffer: 0.2            # 碰撞前必须停止的时间缓冲 (s)，默认: 0.2
  
  scaling_speed: 10.0              # 开始缩放机器人足迹的速度 (m/s)，默认: 0.25
  max_scaling_factor: 0.8          # 足迹最大缩放系数，默认: 0.2

  # ============================================================================
  # 振荡检测参数 (DWA 特有)
  # ============================================================================
  oscillation_reset_dist: 0.1      # 重置振荡标志的距离 (m)，默认: 0.05
  oscillation_reset_angle: 0.2     # 重置振荡标志的角度 (rad)，默认: 0.2

  # ============================================================================
  # 轨迹前瞻评分 (自定义参数)
  # ============================================================================
  heading_lookahead: 1.0           # 航向前瞻距离
  heading_scoring: true            # 启用航向评分
  heading_scoring_timestep: 1.0    # 航向评分时间步长

  # ============================================================================
  # 其他参数 (Generic Local Planner 参数)
  # ============================================================================
  prune_plan: true                 # 从最近点开始跟随全局路径，默认: false

  # ============================================================================
  # 可视化和调试 (源代码中的参数)
  # ============================================================================
  publish_traj_pc: true            # 发布轨迹点云到RViz，默认: false
  publish_cost_grid_pc: false      # 发布代价网格点云到RViz，默认: false
  global_frame_id: map             # 全局坐标系，默认: odom
  
  # ============================================================================
  # 机器人类型
  # ============================================================================
  holonomic_robot: false            # 是否为全向移动机器人 (可x,y,theta独立移动)