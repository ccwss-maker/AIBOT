# Move Base Flex (MBF) Configuration
# 基于 mbf_abstract_nav 和 mbf_costmap_nav 的标准参数

# ============================================================================
# 坐标系配置 (MBF核心参数)
# ============================================================================
robot_frame: local_map           # 机器人坐标系，默认: base_link
global_frame: map                # 全局坐标系，默认: map

# ============================================================================
# 规划器 (Planner) 配置
# ============================================================================
planner_frequency: 1.0           # 规划器调用频率 (Hz)，0 表示仅调用一次，默认: 0
planner_patience: 5.0            # 规划器超时时间 (秒)，默认: 5.0
planner_max_retries: 3           # 规划器最大重试次数，-1 表示无限重试，默认: -1

# ============================================================================
# 控制器 (Controller) 配置
# ============================================================================
controller_frequency: 10.0       # 控制器调用频率 (Hz)
controller_patience: 5.0         # 控制器超时时间 (秒)，默认: 5.0
controller_max_retries: 3        # 控制器在单次控制周期内失败后的重试次数（NOT与recovery相关）

# ============================================================================
# 恢复行为 (Recovery) 配置
# ============================================================================
recovery_enabled: true           # 是否启用恢复行为，默认: true
recovery_patience: 15.0          # 恢复行为超时时间 (秒)，默认: 15.0

# ============================================================================
# 振荡检测配置
# ============================================================================
oscillation_timeout: 0.0         # 振荡检测超时 (秒)，0 表示禁用，默认: 0.0
oscillation_distance: 0.5        # 振荡距离阈值 (米)，默认: 0.5

# ============================================================================
# Costmap相关配置
# ============================================================================
shutdown_costmaps: false         # 不活动时是否关闭costmap，默认: false
shutdown_costmaps_delay: 1.0     # 关闭costmap前的延迟时间 (秒)，默认: 1.0

# ============================================================================
# 插件配置 - Planners (全局规划器)
# 必须是数组格式，每个元素包含 name 和 type 字段
# ============================================================================
planners:
  - name: navfn/NavfnROS
    type: navfn/NavfnROS

# ============================================================================
# 插件配置 - Controllers (局部控制器/跟踪器)
# 必须是数组格式，每个元素包含 name 和 type 字段
# ============================================================================
controllers:
  # 使用 NTU Controller
  # - name: ntu_planner/NTUController
  #   type: ntu_planner/NTUController
  
  # # 也可以保留 DWA 作为备选
  # - name: local_planner/DWAPlannerROS
  #   type: dwa_local_planner/DWAPlannerROS
  - name: local_planner/TebLocalPlannerROS_Ackermann
    type: teb_local_planner/TebLocalPlannerROS

  - name: local_planner/TebLocalPlannerROS_Omnidirectiona
    type: teb_local_planner/TebLocalPlannerROS

# ============================================================================
# 恢复行为插件配置
# 当规划器或控制器失败时，按顺序执行这些恢复行为
# ============================================================================
recovery_behaviors:
  # 1. 清除局部代价地图中的障碍物（可能是传感器噪声）
  - name: clear_costmap_local
    type: clear_costmap_recovery/ClearCostmapRecovery
  
  # 2. 原地旋转360度，重新扫描环境
  - name: rotate_recovery
    type: rotate_recovery/RotateRecovery
  
  # 3. 清除全局和局部代价地图
  - name: clear_costmap_global
    type: clear_costmap_recovery/ClearCostmapRecovery
  
  # # 4. 更激进的恢复：缓慢移动同时清除障碍物
  # - name: move_slow_and_clear
  #   type: move_slow_and_clear/MoveSlowAndClear
