#!/usr/bin/env python
PACKAGE = "ntu_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Pure Pursuit 参数（默认值与 YAML 一致）
gen.add("max_vel_x", double_t, 0, "Maximum linear velocity", 0.5, 0.0, 5.0)
gen.add("max_vel_theta", double_t, 0, "Maximum angular velocity", 0.3, 0.0, 3.14)
gen.add("xy_goal_tolerance", double_t, 0, "XY goal tolerance", 0.2, 0.01, 1.0)
gen.add("yaw_goal_tolerance", double_t, 0, "Yaw goal tolerance", 0.2, 0.01, 1.57)
gen.add("lookahead_distance", double_t, 0, "Lookahead distance for pure pursuit", 0.5, 0.1, 5.0)

exit(gen.generate(PACKAGE, "ntu_planner", "NTUController"))
