#!/usr/bin/env python
PACKAGE = "ntu_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# 优化权重参数（默认值与 YAML 一致）
gen.add("weight_time", double_t, 0, "Weight for time cost", 0.1, 0.0, 10.0)
gen.add("weight_energy_x", double_t, 0, "Weight for energy cost in X", 1.0, 0.0, 100.0)
gen.add("weight_energy_y", double_t, 0, "Weight for energy cost in Y", 1.0, 0.0, 100.0)
gen.add("weight_energy_w", double_t, 0, "Weight for energy cost in Theta", 0.1, 0.0, 100.0)
gen.add("weight_position_x", double_t, 0, "Weight for position tracking in X", 1.0, 0.0, 1000.0)
gen.add("weight_position_y", double_t, 0, "Weight for position tracking in Y", 1.0, 0.0, 1000.0)
gen.add("weight_position_w", double_t, 0, "Weight for position tracking in Theta", 1.0, 0.0, 100.0)

# 优化器参数（默认值与 YAML 一致）
gen.add("init_time", double_t, 0, "Initial time for each segment", 0.5, 0.1, 5.0)
gen.add("astar_point_interval", int_t, 0, "Interval for sampling A* path", 2, 1, 10)
gen.add("max_iterations", int_t, 0, "Maximum LBFGS iterations", 1000, 100, 5000)
gen.add("min_step", double_t, 0, "Minimum step size for LBFGS", 1e-5, 1e-10, 1e-2)
gen.add("epsilon", double_t, 0, "Convergence epsilon for LBFGS", 1e-5, 1e-10, 1e-2)

# 可视化参数（默认值与 YAML 一致）
gen.add("viz_only_control_points", bool_t, 0, "Visualize only control points (true) or sampled trajectory (false)", True)
gen.add("viz_time_step", double_t, 0, "Time step for trajectory visualization", 0.2, 0.01, 1.0)

exit(gen.generate(PACKAGE, "ntu_planner", "TrajectoryOptimizer"))
