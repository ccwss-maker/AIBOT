#!/usr/bin/env python
PACKAGE = "ntu_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Find t_star 参数
gen.add("coarse_grid_size", double_t, 0, "Coarse grid size", 0.1, 0.01, 1.0)
gen.add("find_t_star_time_step", double_t, 0, "Time step for finding t_star", 0.1, 0.01, 1.0)
gen.add("eta", double_t, 0, "Learning rate", 0.01, 0.001, 0.1)
gen.add("c", double_t, 0, "Armijo control parameter", 0.1, 0.01, 1.0)
gen.add("tol", double_t, 0, "Tolerance", 1e-6, 1e-10, 1e-3)
gen.add("max_iter", int_t, 0, "Maximum iterations for finding t_star", 1000, 100, 10000)

# Compute SDF 参数
gen.add("sdf_resolution", double_t, 0, "SDF resolution", 0.8, 0.01, 2.0)
gen.add("sdf_safety_hor", double_t, 0, "Safety distance from obstacles", 1.0, 0.1, 5.0)

# Optimization 参数
gen.add("sdf_opimiz_times_max", int_t, 0, "Maximum optimization steps", 10000, 100, 50000)
gen.add("sdf_opimiz_weight_time", double_t, 0, "Weight for time cost", 1.0, 0.0, 10.0)
gen.add("sdf_opimiz_weight_energy_x", double_t, 0, "Weight for energy cost in X", 1.0, 0.0, 100.0)
gen.add("sdf_opimiz_weight_energy_y", double_t, 0, "Weight for energy cost in Y", 1.0, 0.0, 100.0)
gen.add("sdf_opimiz_weight_energy_w", double_t, 0, "Weight for energy cost in Theta", 1.0, 0.0, 100.0)
gen.add("sdf_opimiz_weight_yaw", double_t, 0, "Weight for swept volume", 0.1, 0.0, 10.0)
gen.add("sdf_opimiz_weight_safety", double_t, 0, "Weight for safety from obstacles", 1.0, 0.0, 100.0)

# Costmap-related parameters (区域参数)
gen.add("width", double_t, 0, "Local costmap width (meters)", 10.0, 1.0, 50.0)
gen.add("height", double_t, 0, "Local costmap height (meters)", 10.0, 1.0, 50.0)

# Vehicle footprint parameter (4 vertices: [x1, y1, x2, y2, x3, y3, x4, y4])
gen.add("footprint", str_t, 0, "Vehicle footprint vertices", "[[0.45, 0.35], [0.45, -0.35], [-0.45, -0.35], [-0.45, 0.35]]")

# 可视化参数
gen.add("viz_only_control_points", bool_t, 0, "Visualize only control points (true) or sampled trajectory (false)", True)
gen.add("viz_time_step", double_t, 0, "Time step for trajectory visualization", 0.2, 0.01, 1.0)

exit(gen.generate(PACKAGE, "ntu_planner", "SDFOptimizer"))
