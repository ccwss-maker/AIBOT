common:
  msg_source: 1                                   # 1: 消息来源于在线雷达
  send_point_cloud_ros: true                      # true: 将点云发送到ROS以便查看
  send_laser_scan_ros: true                       # true: 发送极坐标点云的话题到ROS以便查看,只支持单线雷达
  send_device_ctrl_state_ros: false               # true: 将设置设备状态的交互数据发送到ROS以便查看

lidar:
  # 第一个716mini雷达 (IP: 192.168.1.100)
  - driver:
      lidar_type: vanjee_716mini                    # LiDAR类型
      connect_type: 1                               # 连接方式 1-udp  2-tcp
      host_msop_port: 7000                          # 接收点云数据的主机端口号
      lidar_msop_port: 6060                         # 雷达端口号
      start_angle: 0                              # 点云起始角度
      end_angle: 360                                # 点云结束角度
      wait_for_difop: true                          # 是否等角度标定表参数导入
      min_distance: 0.05                            # 点云最小距离
      max_distance: 30                              # 点云最大距离
      use_lidar_clock: false                         # true: 使用雷达时间作为消息时间戳
      config_from_file: false                       # 从配置文件内获取参数
      dense_points: true                           # 输出的点云中是否剔除标记为NAN的点
      ts_first_point: true                          # 点云的时间戳是否第一个点的时间
      use_offset_timestamp: true                    # 使用相对时间戳
      publish_mode: 0                               # 回波模式 0-发布第一重，1-发布第二重；2-发布两重；
      group_address: 0.0.0.0                       # 组播地址
      host_address: 192.168.1.5                  # 接收点云数据的主机IP地址（请根据实际情况修改）
      lidar_address: 192.168.1.100                 # 雷达IP地址
      x: 0                                          # x方向偏移量 m
      y: 0                                          # y方向偏移量 m
      z: 0                                          # z方向偏移量 m
      roll: 0                                       # 横滚角偏移量 °
      pitch: 0                                      # 俯仰角偏移量 °
      yaw: 0                                        # 航向角偏移量 °
      use_vlan: false                               # PCAP文件中的Packet是否包含VLAN层
    ros:
      ros_frame_id: vanjee_lidar_front                                        # Frame id
      ros_send_point_cloud_topic: /vanjee_points716mini_front                     # 第一个雷达点云话题
      ros_send_laser_scan_topic: /vanjee_scan716mini_front                        # 第一个雷达扫描话题
      ros_send_device_ctrl_state_topic: /vanjee_lidar_device_ctrl_state_front     # 第一个雷达设备控制话题

  # 第二个716mini雷达 (IP: 192.168.1.101)
  - driver:
      lidar_type: vanjee_716mini                    # LiDAR类型
      connect_type: 1                               # 连接方式 1-udp  2-tcp
      host_msop_port: 7001                          # 接收点云数据的主机端口号（不同端口）
      lidar_msop_port: 6060                         # 雷达端口号
      start_angle: 0                                # 点云起始角度
      end_angle: 360                                # 点云结束角度
      wait_for_difop: true                          # 是否等角度标定表参数导入
      min_distance: 0.05                            # 点云最小距离
      max_distance: 30                              # 点云最大距离
      use_lidar_clock: false                         # true: 使用雷达时间作为消息时间戳
      config_from_file: false                       # 从配置文件内获取参数
      dense_points: true                           # 输出的点云中是否剔除标记为NAN的点
      ts_first_point: true                          # 点云的时间戳是否第一个点的时间
      use_offset_timestamp: true                    # 使用相对时间戳
      publish_mode: 0                               # 回波模式 0-发布第一重，1-发布第二重；2-发布两重；
      group_address: 0.0.0.0                       # 组播地址
      host_address: 192.168.1.5                  # 接收点云数据的主机IP地址（请根据实际情况修改）
      lidar_address: 192.168.1.101                 # 雷达IP地址
      x: 0                                          # x方向偏移量 m
      y: 0                                          # y方向偏移量 m
      z: 0                                          # z方向偏移量 m
      roll: 0                                       # 横滚角偏移量 °
      pitch: 0                                      # 俯仰角偏移量 °
      yaw: 0                                        # 航向角偏移量 °
      use_vlan: false                               # PCAP文件中的Packet是否包含VLAN层
    ros:
      ros_frame_id: vanjee_lidar_back                                           # Frame id
      ros_send_point_cloud_topic: /vanjee_points716mini_back                     # 第二个雷达点云话题
      ros_send_laser_scan_topic: /vanjee_scan716mini_back                        # 第二个雷达扫描话题
      ros_send_device_ctrl_state_topic: /vanjee_lidar_device_ctrl_state_back     # 第二个雷达设备控制话题


      
